<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Animation</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b10;display:grid;place-items:center;overflow:hidden}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
</style></head>
<body><canvas id="c"></canvas>
<script>
// ===== 1. 規格（只改這裡）=====
const W = 160, H = 90;          // 邏輯畫布
const FPS = 10;                 // 點陣節奏（8–12）
const DURATION = 2;             // 秒
const PAL = [                   // 固定色盤，索引即顏色；全片只能用這些
  '#0b0b10','#1d1a2f','#2e2a4f','#4b3f72','#7a5ea8','#b48ce0', // 0-5 背景/袍子
  '#f4e8c1','#e0b07a','#a86a3c','#5a3a22',                     // 6-9 皮膚/木杖
  '#3fd0ff','#a8f4ff','#ffffff','#ffd84a','#ff7a3c','#3a5a40'  // 10-15 魔法/星/地面
];
// 時間軸：狀態依序循環，dur 單位秒，總和 = DURATION
const STATES = [
  {name:'idle',    dur:0.6},
  {name:'charge',  dur:0.6},
  {name:'cast',    dur:0.5},
  {name:'recover', dur:0.3},
];

// ===== 2. 引擎（不要改）=====
const cv = document.getElementById('c'), ctx = cv.getContext('2d', {alpha:false});
cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
const Q = new URLSearchParams(location.search);
const SCALE = +Q.get('scale') || Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
cv.style.width = W * SCALE + 'px'; cv.style.height = H * SCALE + 'px';

const I = Math.floor;
function rect(x, y, w, h, c){ ctx.fillStyle = PAL[c]; ctx.fillRect(I(x), I(y), I(w), I(h)); }
function px(x, y, c){ rect(x, y, 1, 1, c); }
// sprite: 字串陣列，字元 → 色盤索引（map），'.' 透明
function sprite(rows, x, y, map, flip=false){
  x = I(x); y = I(y);
  for (let r = 0; r < rows.length; r++) for (let k = 0; k < rows[r].length; k++){
    const ch = rows[r][k]; if (ch === '.') continue;
    px(flip ? x + rows[r].length - 1 - k : x + k, y + r, map[ch]);
  }
}
const step = (v, n) => I(v * n) / n;          // 數值量化到 n 階
const tri = p => 1 - Math.abs(2 * p - 1);       // 0→1→0
function stateAt(t){                            // t 已在 [0, DURATION)
  let acc = 0;
  for (const s of STATES){ if (t < acc + s.dur) return {name:s.name, p:(t-acc)/s.dur, local:t-acc}; acc += s.dur; }
  const s = STATES[STATES.length-1]; return {name:s.name, p:1, local:s.dur};
}
// 決定性雜湊（取代 Math.random）
const hash = n => { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; };

// ===== 3. 場景（依分鏡改寫；以下為巫師施法範例）=====
const WIZ_MAP = {h:3,H:4,l:5,s:6,S:7,e:0,b:12,r:3,R:4};
const WIZ = [
  '......h.....',
  '.....hHh....',
  '....hHHHh...',
  '...hHHlHHh..',
  '..hhhhhhhhh.',
  '....sSSs....',
  '....seSe....',
  '....bbbb....',
  '...bbbbbb...',
  '...rRRRRr...',
  '..rRRRRRRr..',
  '..rRRlRRRr..',
  '..rRRRRRRr..',
  '..rRRlRRRr..',
  '.rRRRRRRRRr.',
  '.rrrrrrrrrr.',
];

function drawBG(f){
  rect(0, 0, W, H, 1);
  for (let i = 0; i < 24; i++){                       // 星星：閃爍由 frame 決定
    const x = I(hash(i*7+1) * W), y = I(hash(i*13+5) * 55);
    if ((I(f/3) + i) % 5) px(x, y, i % 3 ? 4 : 12);
  }
  rect(0, 70, W, 20, 15); rect(0, 70, W, 1, 3);
}

function drawWizard(x, y, st, f){
  let bob = 0, staffY = 0, glow = 0;
  if (st.name === 'idle')    bob = (I(f/3) % 2);
  if (st.name === 'charge')  { bob = 1; staffY = -step(st.p, 4) * 4; glow = 1 + I(st.p * 3); }
  if (st.name === 'cast')    { staffY = -4; glow = 4; }
  if (st.name === 'recover') { staffY = -4 + step(st.p, 2) * 4; }
  sprite(WIZ, x, y + bob, WIZ_MAP);
  const sx = x + 12, sy = y + 2 + staffY;             // 法杖
  rect(sx, sy, 1, 16 - staffY, 8); px(sx, sy + 16 - staffY, 9);
  rect(sx - 1, sy - 1, 3, 2, glow ? 10 : 9);
  if (glow){                                          // 集氣光圈：像素環
    const r = glow;
    for (let a = 0; a < 8; a++){
      const ang = a / 8 * Math.PI * 2 + f * 0.6;
      px(sx + Math.round(Math.cos(ang) * (r+1)), sy + Math.round(Math.sin(ang) * (r+1)), a % 2 ? 11 : 10);
    }
  }
  return {sx, sy};
}

function drawBolt(from, st){
  if (st.name !== 'cast') return;
  const len = I(st.p * 70);
  for (let i = 0; i < len; i++){
    const yy = from.sy + ((i >> 2) % 2 ? -1 : 0);
    px(from.sx + 2 + i, yy, i > len - 4 ? 12 : 10);
    if (i % 3 === 0) px(from.sx + 2 + i, yy + 1, 11);
  }
  if (st.p > 0.6){ const cx = from.sx + 2 + len; rect(cx-1, from.sy-2, 3, 5, 13); rect(cx-2, from.sy-1, 5, 3, 14); px(cx, from.sy, 12); }
}

// 唯一入口：畫面完全由 t 決定（必須回傳 {t, frame, state}）
function renderAt(t){
  t = ((t % DURATION) + DURATION) % DURATION;
  const f = I(t * FPS);                // 量化到點陣格
  const tq = f / FPS;
  const st = stateAt(tq);
  drawBG(f);
  const tip = drawWizard(40, 54, st, f);
  drawBolt(tip, st);
  return {t:tq, frame:f, state:st.name};
}

// ===== 4. 播放與驗收介面（不要改）=====
let paused = Q.has('t'), start = performance.now(), last = -1;
function loop(now){
  if (!paused){
    const t = ((now - start) / 1000) % DURATION, f = I(t * FPS);
    if (f !== last){ last = f; renderAt(t); }
  }
  requestAnimationFrame(loop);
}
renderAt(paused ? +Q.get('t') : 0); requestAnimationFrame(loop);
window.__pixel = {
  W, H, FPS, DURATION, PAL, SCALE, STATES: STATES.map(s => s.name),
  renderAt, pause(){ paused = true; }, play(){ paused = false; start = performance.now(); },
  pixels(){ return Array.from(ctx.getImageData(0, 0, W, H).data); },
};
</script></body></html>
