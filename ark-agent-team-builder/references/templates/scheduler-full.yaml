timezone: Asia/Taipei

jobs:
  # ── 狀態回報 → 管理者私訊 ──────────────────────────────────
  - id: hourly-check
    target: admin-agent
    prompt: |
      ⏰ 確認團隊狀態並回報。
      規則：
      - 無事可報 → 用一句友善的話帶過（≤ 30 字），不要輸出日誌
      - 有進度 → emoji + 一行摘要
      - 跟前次相同 → 不回報（靜默，不發 reply）
      - 禁止輸出 raw JSON、檔案內容、memory.md 原始文字
    cron: "0 9-21 * * *"
    reply_to: private

  # ── 每日摘要 ───────────────────────────────────────────────
  - id: daily-summary
    target: leader-agent
    prompt: |
      📋 今日摘要。
      規則：
      - 有成果 → emoji + 完成項目 + 明日計劃
      - 無成果 → 一句友善話（如「今天休息日，明天繼續 💪」）
      - ≤ 100 字，不要輸出 raw 資料
    cron: "0 21 * * *"
    reply_to: private

  # ── 系統管理摘要 → 管理者私訊 ──────────────────────────────
  - id: daily-ops-report
    target: admin-agent
    prompt: |
      📊 產出每日系統管理摘要（私訊回報）：
      1. Agent 狀態（X/N running）
      2. 今日重啟次數
      3. 錯誤通報
    cron: "5 21 * * *"
    reply_to: private

  # ── 每日知識沉澱 → 廣播全員 ─────────────────────────────────
  - id: daily-knowledge-digest
    target: admin-agent
    prompt: |
      請用 broadcast_all 廣播：
      「📚 每日知識沉澱時間！請整理今日學到的知識，寫入 knowledge/wiki/。」
    cron: "30 21 * * *"
    reply_to: private

  # ── 知識庫自動 ingest（每日 22:00）─────────────────────────
  - id: wiki-ingest
    target: admin-agent
    prompt: |
      📚 執行知識庫 ingest：
      1. 掃描所有 agents/*/knowledge/raw/ 新增檔案
      2. LLM 分析通用性 → 提取到根目錄 knowledge/raw/
      3. 對根目錄 knowledge/raw/ 執行 ingest → 產出 wiki/
      4. 回報：新增幾篇、更新幾篇
    cron: "0 22 * * *"
    reply_to: private

  # ── 科技日報自動產出（每日 08:30）────────────────────────────
  - id: daily-news
    target: ai-dev-agent
    prompt: |
      📰 產出今日科技日報：
      1. 抓取 Hacker News + TechCrunch 頭條
      2. 分類（AI / 程式語言 / 綜合科技）
      3. 產出 HTML 日報 → output/news/
      4. 推送摘要到 Telegram
    cron: "30 8 * * 1-5"
    reply_to: private
