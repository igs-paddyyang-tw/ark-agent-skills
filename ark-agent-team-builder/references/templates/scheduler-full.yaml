# 多層專家團隊排程範本（3.3.0 起：三種排程 —— 腳本／閘門／固定 LLM，見 references/schedule-cost.md）
# 舊版（每小時 hourly-check、每日摘要／維運／broadcast_all 知識沉澱／ingest）閒置週約 120 個 LLM 回合＋全隊扇出；
# 本版閒置週約 5～7 個（只剩內容產出），忙碌時觸發次數和舊版相近。
timezone: Asia/Taipei

jobs:
  # ── 閘門：有事才叫 LLM（規則在 config/gated_jobs.json，提詞在 config/gated_prompts/<job>.md）──
  - id: progress-check              # 任務板有未完成任務才喚醒 admin-agent
    type: command
    command: [".venv/bin/python", "scripts/sched_gate.py", "progress-check"]
    cron: "0 9 * * 1-5"

  - id: weekly-summary              # 本週有人寫 daily 才摘要
    type: command
    command: [".venv/bin/python", "scripts/sched_gate.py", "weekly-summary"]
    cron: "0 21 * * 5"

  - id: wiki-ingest                 # knowledge/raw（含各 agent）有新檔才 ingest；取代「broadcast_all 叫大家整理知識」
    type: command
    command: [".venv/bin/python", "scripts/sched_gate.py", "wiki-ingest"]
    cron: "0 22 * * *"

  - id: memory-distill              # 只喚醒有新 daily 的 agent（@new_daily）
    type: command
    command: [".venv/bin/python", "scripts/sched_gate.py", "memory-distill"]
    cron: "20 3 * * 0"

  # ── 腳本：零 LLM ─────────────────────────────────────────────────────────
  - id: preflight                   # 服務／設定健檢；有 P0 時 daemon 會私訊通知（取代每日 LLM 維運日報）
    target: _builtin:preflight
    cron: "50 8 * * 1-5"

  # ── 固定叫 LLM：產出本身就是內容 ─────────────────────────────────────────
  - id: daily-news
    target: ai-dev-agent
    prompt: |
      📰 產出今日科技日報：
      1. 抓取 Hacker News + TechCrunch 頭條
      2. 分類（AI / 程式語言 / 綜合科技）
      3. 產出 HTML 日報 → output/news/
      4. 推送摘要到 Telegram
    cron: "30 8 * * 1-5"
    reply_to: private
