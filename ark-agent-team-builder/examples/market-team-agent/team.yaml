# market-team-agent 配置（市場情報團隊）— ark_team_agent 套件
# 啟動：.venv/bin/python start.py（或 systemctl --user start market-team-agent）
#
# 結構：market-agent（總機/私訊）→ leader（統籌）→ 3 worker（競品/趨勢/報告）+ admin（維運）
# 設定集中本檔；機密在 .env；排程在 scheduler.yaml。

defaults:
  backend: kiro-cli
  model: auto

# 知識庫查詢櫃順序（market-team-agent 自有 + 共用）
knowledge_search_order: [market-team-agent, shared]

# [skill 自動鋪設關閉，交 sync 管；成員表以 team.yaml 為唯一真相每次同步]
kiro_files:
  skills:
    policy: skip
  steering:
    team_md: always

channel:
  bot_token_env: MARKET_TELEGRAM_BOT_TOKEN
  # group_id: -100xxxxxxxxxx        # TG 群組 id（建群後填）
  # announce_topics: []             # 只收不回的公告頻道（如有）

access:
  mode: group
  allowed_users:
    - 937896656                      # paddyyang

cost_guard:
  daily_limit_usd: 10.0
  warn_at_percentage: 80
  timezone: Asia/Taipei

hang_detector:
  enabled: true
  timeout_minutes: 180
  escalation_minutes: 360

instances:
  # ═══ 總機（私訊）═══
  market-agent:
    working_directory: .
    description: "🗺️ 市場情報總機 — 意圖路由、知識查詢、競品/趨勢總覽"
    role: manager
    private_chat: 937896656
    skip_resume: false

  # ═══ 統籌（General）═══
  leader-agent:
    working_directory: agents/leader-agent
    description: "🎯 情報統籌 — 拆解情報需求、派工、驗收彙整"
    role: leader
    group_members: [competitor-agent, trend-agent, report-agent]

  # ═══ 維運（General）═══
  admin-agent:
    working_directory: agents/admin-agent
    description: "👑 維運 — 監控、費控、服務健康"
    role: admin

  # ═══ 職人（worker，輸出自動發到 leader topic）═══
  competitor-agent:
    working_directory: agents/competitor-agent
    description: "🔍 競品分析 — 產品/定價/功能對比、競爭態勢"
    role: worker

  trend-agent:
    working_directory: agents/trend-agent
    description: "📈 趨勢研究 — 市場動態、新品、法規、玩家偏好"
    role: worker

  report-agent:
    working_directory: agents/report-agent
    description: "📝 情報報告 — 彙整分析為 MD→HTML→TG 報告"
    role: worker

health_port: 23040
