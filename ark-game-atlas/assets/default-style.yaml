# ark-html-report token 契約；圖書館外層覆寫 :root 可統一主題
name: atlas-default
theme: dark
tokens:
  --bg: "#141416"
  --surface: "#1E1E22"
  --surface-2: "#0F0F11"
  --border: "rgba(255,255,255,.12)"
  --text: "#ECE8E1"
  --text-2: "#BDB6AA"
  --text-3: "#8B857B"
  --accent: "#D4B15C"
  --accent-soft: "rgba(212,177,92,.14)"
  --ok: "#5FB47A"
  --warn: "#D9A441"
  --danger: "#D9605A"
  --info: "#6FA8DC"
  --c1: "#D4B15C"
  --c2: "#5FB47A"
  --c3: "#6FA8DC"
  --c4: "#D9605A"
  --c5: "#B08D3C"
  --c6: "#8B857B"
  --font-display: "\"Noto Serif TC\",\"Songti TC\",Georgia,serif"
  --font-body: "\"Noto Sans TC\",\"Microsoft JhengHei\",\"PingFang TC\",sans-serif"
  --font-mono: "\"JetBrains Mono\",\"Noto Sans TC\",monospace"
  --radius: "8px"
  --radius-sm: "4px"
  --shadow: "0 10px 30px rgba(0,0,0,.45)"
  --maxw: "960px"
