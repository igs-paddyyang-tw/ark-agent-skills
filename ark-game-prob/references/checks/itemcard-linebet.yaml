# 道具卡 LineBet 偏差檢核表規格（ark-game-prob check pattern）
# 由 ps_xlsx --kind check --spec 此檔 產出 <name>.xlsx 表單。
# 人填「輸入」欄 → 公式即時判定（未填/非整數/量級錯誤/未遞增/超門檻/警告/OK）。
contract: "1"
name: itemcard-linebet
title: 道具卡 LineBet 偏差檢核
# 門檻放可調輸入格（不寫死）
thresholds:
  warn: 0.03      # 偏差警告門檻 3%
  error: 0.10     # 偏差錯誤門檻 10%
columns: [層級, LineBet輸入, 參考金額, 偏差, 檢核]
# rows：每列 [層級, 輸入(人填→null), 參考值, 偏差公式(字串), 檢核公式(字串)]
# 偏差/檢核為活公式字串（= 開頭），openpyxl 不算、開 Excel 生效
rows:
  - [C,   null, 100,  "=IF(B4=\"\",\"\",B4/C4-1)",  "=IF(B4=\"\",\"未填\",IF(B4<>INT(B4),\"X 非整數\",IF(ABS(D4)>$E$1,\"X 超錯誤門檻\",IF(ABS(D4)>$C$1,\"! 警告\",\"OK\"))))"]
  - [B,   null, 200,  "=IF(B5=\"\",\"\",B5/C5-1)",  "=IF(B5=\"\",\"未填\",IF(B5<>INT(B5),\"X 非整數\",IF(B5<=B4,\"X 未遞增\",IF(ABS(D5)>$E$1,\"X 超錯誤門檻\",IF(ABS(D5)>$C$1,\"! 警告\",\"OK\")))))"]
  - [A,   null, 400,  "=IF(B6=\"\",\"\",B6/C6-1)",  "=IF(B6=\"\",\"未填\",IF(B6<>INT(B6),\"X 非整數\",IF(B6<=B5,\"X 未遞增\",IF(ABS(D6)>$E$1,\"X 超錯誤門檻\",IF(ABS(D6)>$C$1,\"! 警告\",\"OK\")))))"]
  - [S,   null, 800,  "=IF(B7=\"\",\"\",B7/C7-1)",  "=IF(B7=\"\",\"未填\",IF(B7<>INT(B7),\"X 非整數\",IF(B7<=B6,\"X 未遞增\",IF(ABS(D7)>$E$1,\"X 超錯誤門檻\",IF(ABS(D7)>$C$1,\"! 警告\",\"OK\")))))"]
  - [SS,  null, 1600, "=IF(B8=\"\",\"\",B8/C8-1)",  "=IF(B8=\"\",\"未填\",IF(B8<>INT(B8),\"X 非整數\",IF(B8<=B7,\"X 未遞增\",IF(ABS(D8)>$E$1,\"X 超錯誤門檻\",IF(ABS(D8)>$C$1,\"! 警告\",\"OK\")))))"]
