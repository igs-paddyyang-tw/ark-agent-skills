# 遊戲產出佈局契約 v3（機器可讀版）——人讀版：game-layout-contract.md（兩者同步改）
contract: "3.1"
owner: ark-game-spec
updated: 2026-10-16
homes:
  data: "data/{domain}/{slug}"        # 定版家，入 git
  output: "output/{domain}/{slug}"    # 工作檯，不入 git
limits:
  data_total_kb: 1024
  single_file_kb: 500
  forbid_suffix: [.exe, .dll, .so, .mp4, .mov, .zip, .7z]
stages:
  "①": {dir: analysis, skill: ark-game-spec}
  "②": {dir: spec, skill: ark-game-spec}
  "③⑤": {dir: prob, skill: ark-game-prob}
  "④": {dir: quicktest, skill: ark-game-quicktest}
  "⑥": {dir: proto, skill: ark-game-proto}
  "⑦": {dir: game/pixi-client, skill: ark-game-proto}
  "⑧": {dir: game/go-server, skill: engineering}
  "⑨": {dir: docs/reports, skill: [game_perf_probe, math-reviewer]}
data_tree:
  root_files: [README.md, LAYOUT.md, layout-report.json, publish-manifest.json]
  analysis: {files: [game-analysis.yaml, kb-refs.yaml, evidence.jsonl], dirs: [report, source]}
  analysis/source: {files: [manifest.json, "competitor-spec-*.md"]}
  spec: {files: [game-spec.v1.md, decisions.yaml, decisions-applied.json, config-spec.yaml], dirs: [dev-spec, gdd]}
  spec/dev-spec: {files: [game-spec.md, feature-spec.md, state-machine.md, ui-spec.md, qa-checklist.md, config-spec.yaml]}
  spec/gdd: {files: [gdd.yaml, symbols.yaml, screens.yaml, info.yaml, i18n.csv], dirs: [rules]}
  prob: {files: [prob-spec.md, prob-spec.html, prob-spec.meta.json, lint-report.json], optional: [prob-spec.xlsx, "config-diff.*", prob-data.json]}
  quicktest: {files: [quicktest.yaml, qt-config.yaml], optional: [symbols.tsv, lint-report.json], dirs: [odds, engine, qt-report, config, _tuning]}
  proto: {optional: [game-config.json, index.html, "go-parity.*", gaps.md]}
  game: {optional: [handoff.md], dirs: [go-server, pixi-client]}
  docs: {dirs: [decisions, designs, reports, versions]}
  kb: {files: [spec.md, prob.md, code.md, qt-result.md, versions.md, methods.md], dirs: [xlsx, paramcheck, notes]}
output_tree: [runs, analysis, gdd, game/pixi-client, game/go-server, proto, build, qt-runs, sandbox, _retired]
modes:
  design: {required: [README.md, analysis, spec, prob, quicktest], optional: [proto, game, docs, kb]}
  restore: {required: [README.md, kb, quicktest], optional: [prob, spec, docs]}
legacy:   # 一個版本內仍可讀；新產出一律寫新路徑
  "proto/stage": "game/pixi-client"
  "server": "game"
  "docs/report": "docs/reports"
  "data/gdd/{slug}": ["spec/gdd", "output/{domain}/{slug}/gdd"]
  "artifacts/cva/{run}": "output/{domain}/{slug}/runs/{run}"
